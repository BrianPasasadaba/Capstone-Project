name: Docker Build

on:
  workflow_dispatch:
  push:
    branches:
      - ForDeployment

jobs:
  build-docker-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            --file Dockerfile \
            --tag capstoneproject:${{ github.sha }} \
            .
